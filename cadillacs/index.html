<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#08060c">
<title>Tailfins &amp; Tyrants</title>
<meta name="description" content="A 1-8 player beat 'em up with muscle cars and dinosaurs. Original fan-made spiritual successor to the 90s arcade brawlers.">
<style>
  :root { --bg: #08060c; --accent: #ffd23a; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #08060c; --accent: #ffd23a; } }
  :root[data-theme="dark"] { --bg: #08060c; --accent: #ffd23a; }
  html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; touch-action: none; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { display: block; background: #000; image-rendering: auto; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
  #rotate { display: none; position: fixed; inset: 0; background: var(--bg); color: var(--accent); font: bold 20px Arial, sans-serif; align-items: center; justify-content: center; text-align: center; padding: 16px; z-index: 5; }
  @media (orientation: portrait) and (max-width: 820px) { #rotate { display: flex; } }
</style>
</head>
<body>
<canvas id="game" width="960" height="540" aria-label="Tailfins and Tyrants game"></canvas>
<div id="rotate">Rotate your phone to landscape to play</div>
<script src="audio.js"></script>
<script src="assets/sprites/data.js"></script>
<script src="sprites.js"></script>
<script src="backgrounds.js"></script>
<script src="art.js"></script>
<script src="game.js"></script>
</body>
</html>
